version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript < 6.1; take the next major only when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
