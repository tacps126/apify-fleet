# Publishes a GitHub Release to npm. OFF until the repository variable
# PUBLISH_ENABLED is set to "true" (Settings, Secrets and variables, Actions,
# Variables). The job runs in the "npm" environment, so you can also require a
# manual approval per publish. Setup: docs/MAINTAINING.md.
name: Publish

on:
  release:
    types: [published] # releases made by hand; release.yml starts this workflow itself
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  npm:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm trusted publishing: no token stored
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use npm 11.5.1 or newer (trusted publishing)
        run: npm install -g npm@latest
      - name: Publish
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish"
            exit 0
          fi
          # No token: npm trusted publishing exchanges this job's OIDC identity
          # (id-token: write) for a one-time publish credential, with provenance.
          case "$version" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac
