# Publishes a GitHub Release to npm. OFF until the repository variable
# PUBLISH_ENABLED is set to "true" (Settings, Secrets and variables, Actions,
# Variables). The job runs in the "npm" environment, so you can also require a
# manual approval per publish. Setup: docs/MAINTAINING.md.
name: Publish

on:
  release:
    types: [published] # releases made by hand; release.yml starts this workflow itself
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  npm:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$(node -p 'require("./package.json").version')" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
