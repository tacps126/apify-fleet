name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: apify-fleet version
      description: Output of `apify-fleet --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: "Node 24, Ubuntu 24.04"
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: "apify-fleet clean builds --all --older-than 30d"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Paste the output (`--json` helps). Never paste API tokens.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: fleet.json (if used, trimmed)
      render: json
